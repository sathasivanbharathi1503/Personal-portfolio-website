<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Background Video */
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Contact Form Box */
        .contact-box {
            width: 700px;
            background: rgba(0, 0, 0, 0.7);
            padding: 25px;
            border-radius: 10px;
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
        }

        .contact-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 14px;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: none;
            outline: none;
            background: #222;
            color: white;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: white;
            color: black;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: gray;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <video autoplay loop muted playsinline>
        <source src="171360-845439617.mp4" type="video/mp4">
    </video>

    <!-- Contact Box -->
    <div class="contact-box">
        <h2>Let's Connect</h2>

        <div class="input-group">
            <label>Name</label>
            <input type="text" id="name">
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" id="phone">
        </div>

        <div class="input-group">
            <label>Email ID</label>
            <input type="email" id="email">
        </div>

        <div class="input-group">
            <label>Message</label>
            <textarea id="message"></textarea>
        </div>

        <button onclick="sendMail()">Send</button>
    </div>

    <script>
function sendMail() {
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let email = document.getElementById("email").value;
    let message = document.getElementById("message").value;

    if (name === "" || phone === "" || email === "" || message === "") {
        alert("Please fill all fields!");
        return;
    }

    let gmailLink =
        "https://mail.google.com/mail/?view=cm&fs=1" +
        "&to=" + encodeURIComponent("sathasivanbharathi@gmail.com") +
        "&su=" + encodeURIComponent("New Contact Form Message from " + name) +
        "&body=" +
        encodeURIComponent(
            "Name: " + name +
            "\nPhone: " + phone +
            "\nEmail: " + email +
            "\nMessage:\n" + message
        );

    window.open(gmailLink, "_blank");
}
</script>


</body>
</html>
